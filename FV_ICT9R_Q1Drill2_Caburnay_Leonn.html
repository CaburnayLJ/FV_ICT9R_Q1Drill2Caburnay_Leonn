<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
</head>
     <style>
        h1{font-family: Arial, Helvetica, sans-serif; text-align: center;} h2{font-family: Arial, Helvetica, sans-serif; margin-bottom: auto;}

        header{
            text-align: center;
        }
        section{
    	background-color: #fff;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    img{
            display: block;
            margin: 0 auto;
            height: 100px;
            width: 100px;
            padding: 0px;
         }
         input[type="text"], select, textarea, input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        input[type="placeholder"] {
          text-align: center;
    }
     </style>
     
<body>
    <header>
        <h1>RATE A MOVIE</h1>
            <br>
        <p> Rate and comment about a movie you've watched!</p>    
    </header>

    <br>

    <section>
        <form action="">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQP1kG43LaitTHejRmQk46N0tojO8liYcwRbOaG2Hallw&s=10" alt="logo">
            <br>

            <label for="movie">Movie Title</label>
            <input type="text" id="movie" name="movie"
            placeholder="Enter here...">

            <br>
            <label for="genre">Genre/s</label>
            <br>
            <input type="checkbox" id="genre1" name="Action" value="Action">
            <label for="genre1">Action</label>

            <input type="checkbox" id="genre2" name="Comedy" value="Comedy">
            <label for="Genre2">Comedy</label>

            <input type="checkbox" id="genre3" name="Drama" value="Drama">
            <label for="genre3">Drama</label>

            <input type="checkbox" id="genre4" name="Fantasy" value="Fantasy">
            <label for="genre4">Fantasy</label>

            <input type="checkbox" id="genre5" name="Horror" value="Horror">
            <label for="genre5">Horror</label>

            <input type="checkbox" id="genre6" name="Romance" value="Romance">
            <label for="genre6">Romance</label>

            <input type="checkbox" id="genre7" name="Other" value="Other">
            <label for="genre7">Other</label>

            <br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rate" value="star1">
            <label for="rate1">⭐</label>
             <input type="radio" id="rate2" name="rate" value="star2">
            <label for="rate2">⭐⭐</label>
             <input type="radio" id="rate3" name="rate" value="star3">
            <label for="rate3">⭐⭐⭐</label>
             <input type="radio" id="rate4" name="rate" value="star4">
            <label for="rate4">⭐⭐⭐⭐</label>
             <input type="radio" id="rate5" name="rate" value="star5">
            <label for="rate5">⭐⭐⭐⭐⭐</label>

            <br>
            <textarea id="review" name="review" placeholder="write a review here..." rows="5" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" name="submit" value="Submit Review">
            <br>
            
            For movie review tips, click<a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a>


        </form>
    </section>
    <!--Reference
	Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10 essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
-->
</body>
</html>,
